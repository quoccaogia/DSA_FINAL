<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Sinh Viên</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Tabs Bar */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
    }

    /* Tab Content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards & Layout */
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button.btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      background: var(--primary-hover);
    }

    /* Display Table for Student Info */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .info-table th, .info-table td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
    }

    .info-table th {
      background-color: #f1f5f9;
      width: 35%;
    }
  </style>
</head>
<body>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('search-tab', this)">1. Tra cứu Sinh viên</button>
    <button class="tab-btn" onclick="switchTab('update-tab', this)">2. Cập nhật Sinh viên (GV)</button>
  </div>

  <!-- ================= TAB 1: TRA CỨU SINH VIÊN ================= -->
  <div id="search-tab" class="tab-content active">
    <div class="card">
      <h2>Tra cứu thông tin Sinh viên</h2>
      <div class="form-group">
        <label>Nhập MSSV:</label>
        <input type="text" id="searchMssv" placeholder="Nhập MSSV (VD: 21110001)...">
      </div>
      <button class="btn-submit" onclick="fetchStudentData()">Tìm Kiếm</button>
    </div>

    <!-- Student Info Display Table -->
    <div class="card" id="studentResultCard" style="display: none;">
      <h2>Thông tin Sinh viên</h2>
      <table class="info-table">
        <tr><th>Họ và Tên</th><td id="res_name">-</td></tr>
        <tr><th>MSSV</th><td id="res_mssv">-</td></tr>
        <tr><th>Ngành Học</th><td id="res_major">-</td></tr>
        <tr><th>Ngày Sinh</th><td id="res_dob">-</td></tr>
        <tr><th>Giới Tính</th><td id="res_gender">-</td></tr>
        <tr><th>GPA Hệ 4</th><td id="res_gpa4">-</td></tr>
        <tr><th>GPA Hệ 10</th><td id="res_gpa10">-</td></tr>
        <tr><th>Số Tín Chỉ</th><td id="res_credit">-</td></tr>
        <tr><th>Điểm Rèn Luyện (ĐRL)</th><td id="res_drl">-</td></tr>
      </table>
    </div>
  </div>

  <!-- ================= TAB 2: CẬP NHẬT SINH VIÊN ================= -->
  <div id="update-tab" class="tab-content">
    <div class="card">
      <h2>Cập Nhật / Thêm Thông Tin Sinh Viên</h2>

      <form id="updateForm">
        <div class="grid-2">
          <div class="form-group">
            <label>MSSV (String):</label>
            <input type="text" id="up_mssv" placeholder="VD: 21110001">
          </div>
          <div class="form-group">
            <label>Họ và Tên (String):</label>
            <input type="text" id="up_name" placeholder="VD: Nguyễn Văn A">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Ngành Học (String):</label>
            <input type="text" id="up_major" placeholder="VD: Công nghệ thông tin">
          </div>
          <div class="form-group">
            <label>Ngày Sinh (d/month/year):</label>
            <input type="text" id="up_dob" placeholder="VD: 15/08/2003">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Giới Tính:</label>
            <select id="up_gender">
              <option value="">Để trống</option>
              <option value="true">Nam</option>
              <option value="false">Nữ</option>
            </select>
          </div>
          <div class="form-group">
            <label>Số Tín Chỉ:</label>
            <input type="number" id="up_credit" placeholder="VD: 120">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>GPA Hệ 4:</label>
            <input type="number" step="0.01" id="up_gpa4" placeholder="VD: 3.55">
          </div>
          <div class="form-group">
            <label>GPA Hệ 10:</label>
            <input type="number" step="0.01" id="up_gpa10" placeholder="VD: 8.85">
          </div>
        </div>

        <div class="form-group">
          <label>Điểm Rèn Luyện (DRL):</label>
          <input type="number" id="up_drl" placeholder="VD: 90">
        </div>

        <button type="button" class="btn-submit" onclick="sendStudentUpdate()">Gửi Cập Nhật</button>
      </form>
    </div>
  </div>
<!-- All your HTML cards and tabs here... -->

 
  <script src="script.js"></script>
</body>
</html>
</body>
</html>
